[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaler-rca"
version = "0.1.0"
description = "Microservice root cause analysis on RCAEval."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pytest>=8.0",
  "PyYAML>=6.0",
  "tabulate>=0.9",
  "tqdm>=4.66",
  "torch>=2.5,<2.6",
  "transformers>=4.40,<5",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
