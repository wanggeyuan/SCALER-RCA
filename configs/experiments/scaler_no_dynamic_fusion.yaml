seed: 42
batch_size: 16
eval_batch_size: 16
epochs: 100
learning_rate: 0.0005
weight_decay: 0.0001
hidden_dim: 128
projection_dim: 128
dropout: 0.1
early_stopping_patience: 15
lr_scheduler_factor: 0.5
lr_scheduler_patience: 5
min_learning_rate: 0.000001
train_fraction: 0.7
val_fraction: 0.15
split_stratify_by: service
include_modalities: [metrics, logs, traces]
stages: [RE1, RE2, RE3]
output_dir: outputs/final_ablation/no_dynamic_fusion
dynamic_fusion_enabled: false
curriculum_enabled: true
metrics_statistics_head_enabled: true
metrics_statistics_head_weight: 1.0
text_encoder:
  model_name: bert-base-uncased
  backend: auto
  max_tokens: 256
  allow_download: true
  hf_endpoint: https://hf-mirror.com
loss_weights:
  task: 1.0
  fault: 0.5
  contrastive: 0.1
  alignment: 0.0
  consistency: 0.0
  fusion: 0.01
curriculum:
  enabled: true
  initial_threshold: 0.45
  min_threshold: 0.45
  max_threshold: 1.0
  step_size: 0.05
  target_score: 0.6
  patience: 2
