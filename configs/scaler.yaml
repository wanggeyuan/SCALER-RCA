seed: 42
batch_size: 16
eval_batch_size: 16
epochs: 100
learning_rate: 0.001
weight_decay: 0.00001
hidden_dim: 256
projection_dim: 256
dropout: 0.15
warmup_epochs: 0
early_stopping_patience: 15
lr_scheduler_factor: 0.5
lr_scheduler_patience: 5
min_learning_rate: 0.000001
max_sequence_length: 256
train_fraction: 0.7
val_fraction: 0.15
include_modalities:
  - metrics
  - logs
  - traces
stages:
  - RE1
  - RE2
  - RE3
systems: []
max_cases_per_system: null
max_train_batches: null
max_eval_batches: null
output_dir: outputs/main
text_encoder:
  model_name: bert-base-uncased
  backend: auto
  max_tokens: 256
  allow_download: true
  hf_endpoint: https://hf-mirror.com
loss_weights:
  task: 1.0
  fault: 0.8
  contrastive: 0.5
  alignment: 0.3
  consistency: 0.2
  fusion: 0.01
curriculum:
  enabled: true
  initial_threshold: 0.45
  min_threshold: 0.2
  max_threshold: 1.0
  step_size: 0.05
  target_score: 0.6
  patience: 2
