seed: 42
batch_size: 8
eval_batch_size: 8
epochs: 100
learning_rate: 0.001
weight_decay: 0.0001
hidden_dim: 128
projection_dim: 128
dropout: 0.1
max_sequence_length: 256
train_fraction: 0.7
val_fraction: 0.15
include_modalities:
  - metrics
  - logs
  - traces
stages:
  - RE1
  - RE2
  - RE3
systems: []
max_cases_per_system: null
max_train_batches: null
max_eval_batches: null
output_dir: outputs/main
text_encoder:
  model_name: bert-base-uncased
  backend: auto
  max_tokens: 256
  allow_download: true
  hf_endpoint: https://hf-mirror.com
loss_weights:
  task: 1.0
  fault: 0.5
  contrastive: 0.1
  alignment: 0.1
  consistency: 0.05
  fusion: 0.01
curriculum:
  enabled: true
  initial_threshold: 0.45
  min_threshold: 0.2
  max_threshold: 1.0
  step_size: 0.05
  target_score: 0.6
  patience: 2
